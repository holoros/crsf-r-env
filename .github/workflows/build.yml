name: build-image
on:
  push:
    branches: [main]
    paths: ["Dockerfile", "r-packages.txt", "pkgs/**", ".github/workflows/build.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/holoros/crsf-r:4.5.1,ghcr.io/holoros/crsf-r:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
